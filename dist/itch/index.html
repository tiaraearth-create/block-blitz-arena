<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Block Blitz Arena</title>
<style>
  html, body { margin: 0; height: 100%; background: #0f1320; overflow: hidden; }
  #frame { display: block; width: 100%; height: 100%; border: 0; }
  /* 読み込み中の案内。iframe が出たら JS が消す。回線が細い人ほど
     「真っ黒な画面で止まった」に見えるので、必ず何か出しておく。 */
  #boot {
    position: fixed; inset: 0; display: grid; place-content: center; gap: 14px;
    text-align: center; color: #c8d4ea; background: #0f1320;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  #boot b { font-size: 22px; letter-spacing: 2px; color: #fff; }
  #boot small { color: #7f8db0; }
  #boot a { color: #4f8cff; }
  .dots::after { content: ''; animation: d 1.2s steps(4, end) infinite; }
  @keyframes d { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }
</style>
</head>
<body>
<div id="boot">
  <b>BLOCK BLITZ ARENA</b>
  <span class="dots">読み込んでいます</span>
  <small>Loading — this game runs on a live server</small>
  <small id="slow" hidden>
    表示されない場合は
    <a href="https://block-blitz-arena.onrender.com/?ref=itch" target="_blank" rel="noopener">こちらから直接プレイ</a>
  </small>
</div>
<iframe id="frame"
  src="https://block-blitz-arena.onrender.com/?ref=itch"
  allow="autoplay; fullscreen; clipboard-write; gamepad; web-share; screen-wake-lock"
  referrerpolicy="strict-origin-when-cross-origin"
  title="Block Blitz Arena"></iframe>
<script>
  var f = document.getElementById('frame'), boot = document.getElementById('boot');
  f.addEventListener('load', function () { boot.remove(); });
  // 埋め込みが弾かれる／サーバーが眠っている場合の逃げ道を8秒後に出す。
  setTimeout(function () {
    var s = document.getElementById('slow');
    if (s) s.hidden = false;
  }, 8000);
</script>
</body>
</html>
