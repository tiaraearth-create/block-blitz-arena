# Render Blueprint — deploy with "New +" → "Blueprint" on render.com
#
# ✅ DATA PERSISTENCE — 永続ディスク構成（starter プラン）
# server/data（アカウント・スコア・ジェム・ギルド・イベント）は下の disk に
# 保存されるので、デプロイでも再起動でも消えません。
#
# ⚠️ 無料プランに戻す場合の注意（plan: free / disk をコメントアウト）
#   free には永続ディスクがありません。デプロイ時だけでなく、15分アイドルで
#   スピンダウンして再起動するたびに server/data が消えます。その構成では
#   push の前に必ず `npm run backup:pull` を実行し、生成された
#   server/seed-backup.json をコミットしてください（起動時に自動復元されます）。
#
# SEED: server/seed-backup.json は起動時に一度だけマージ復元されます
# （db.meta.seedHash で「同じseedは二度適用しない」制御）。ディスクを付けた
# 直後の初回起動でも空のディスクに1回だけ適用されるため、ディスク移行の前に
# seed を最新化しておくと、そのまま正しい状態で立ち上がります。
# ディスク運用が安定したあと自動復元を止めたいときは SEED_RESTORE=0。
#
# SESSIONS: SESSION_SECRET を設定しておくと、再デプロイでもプレイヤーは
# ログアウトされません（未設定だと毎回全員ログアウト）。
services:
  - type: web
    name: block-blitz-arena
    runtime: node
    plan: starter
    # npm ci は package-lock.json のとおりに入れる（npm install は ^ の範囲で
    # 新しい版を拾うので、CI が一度も試していない依存で本番だけが動きうる）。
    # CI も Dockerfile も npm ci なので、これで3系統すべてが lock 準拠になる。
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/status
    # 🌙 毎晩の自動バックアップ（.github/workflows/backup.yml）は
    # server/seed-backup.json だけを更新してコミット＆push する。それが自動
    # デプロイを誘発していた ── このサービスは永続ディスク付きなので Render は
    # ゼロダウンタイムデプロイができず（旧を止めてから新を起動する）、毎晩
    # 全 WebSocket が切れて短時間ダウンしていた。進行中の対戦は引き分けで畳まれる。
    #
    # seed はディスクを失った日の保険であって、載せ替えを急ぐ理由が無い。
    # 次の通常デプロイで一緒に運ばれれば十分なので、この1ファイルだけの変更では
    # デプロイしない。
    # ※ ignoredPaths は「これ以外に変更があればデプロイする」という意味なので、
    #   コードを直した回はこれまでどおり普通にデプロイされる。
    #
    # ⚠️ 引き換えに、本番インスタンスが積んでいる seed は「最後にコードを
    #    デプロイした日のもの」で固定される（以前は毎晩デプロイされていたので
    #    常に24時間以内だった）。GitHub 側には毎晩の最新 seed が入り続けるので、
    #    ディスクを失った日の復旧手順はこう:
    #      Render ダッシュボード → Manual Deploy → Deploy latest commit
    #    手動デプロイは build filter を無視するので、最新の seed ごと載る。
    # ⚠️ free プランへ戻すとき（上の注意書き）は、この buildFilter ブロックも
    #    一緒に外すこと。free にはディスクが無く「毎回の起動が seed からの復元」
    #    なので、夜間バックアップがデプロイされないと復元元が古いまま止まる。
    buildFilter:
      ignoredPaths:
        - server/seed-backup.json
    envVars:
      # 本番の処理系を CI（.github/workflows/*.yml）と Dockerfile に合わせて固定する。
      # 未指定だと Render 側の既定が使われ、その既定が上がった日に無言で変わる。
      - key: NODE_VERSION
        value: "22"
      - key: SESSION_SECRET
        generateValue: true        # long random string; keeps logins across deploys
      - key: ADMIN_PASSWORD
        sync: false                # prompted on first deploy; pins the admin password
      # DATA_DIR を明示するのは保険。server/db.js は未設定だと
      # <このファイルの場所>/data を使うので、Render のチェックアウト先が
      # 変わったり、リポジトリ同梱の Dockerfile（WORKDIR /app）が使われたり
      # すると、下の disk とパスがズレて「空のディスクを見に行く」状態になる。
      # そうなると全起動が初回起動あつかいになり、同梱 seed が毎回適用される。
      # ここを固定しておけば、どう動かしてもディスクを指す。
      - key: DATA_DIR
        value: /opt/render/project/src/server/data
    # --- permanent data ---
    # mountPath must match DATA_DIR (defaults to <repo>/server/data, and Render
    # checks the repo out at /opt/render/project/src).
    disk:
      name: game-data
      mountPath: /opt/render/project/src/server/data
      sizeGB: 1
