# Render Blueprint — deploy with "New +" → "Blueprint" on render.com
#
# ⚠️ DATA PERSISTENCE ⚠️
# The FREE plan has NO persistent disk: server/data (accounts, scores, gems)
# is wiped on every deploy AND whenever the instance restarts.
#
#   Free plan  → before each deploy: 管理者パネル → 💾 バックアップDL
#                after the deploy:   https://<your-url>/?restore=1 → file +
#                the admin password from the backup → ♻️ 復元（マージ）
#   Paid disk  → switch `plan` to `starter` and uncomment the disk block below.
#                Data then survives deploys with nothing to do by hand.
#
# SESSIONS: with SESSION_SECRET set, logins survive deploys/restarts — players
# stay signed in through the wipe and re-attach automatically once the data is
# restored. (Without it, every redeploy logs everyone out.)
services:
  - type: web
    name: block-blitz-arena
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/status
    envVars:
      - key: SESSION_SECRET
        generateValue: true        # long random string; keeps logins across deploys
      - key: ADMIN_PASSWORD
        sync: false                # prompted on first deploy; pins the admin password
    # --- permanent data (requires the paid "starter" plan) ---
