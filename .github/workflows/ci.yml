# push / Pull Request のたびにテストを回す。
#
# 手元で回し忘れても、GitHub 側が必ず1回は回してくれる状態にしておくのが目的。
# 落ちたら GitHub からメールが飛ぶ。
name: test

on:
  push:
    branches: ['**']
  pull_request:

# 同じブランチに続けて push したとき、古い実行は打ち切る。
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # package-lock.json があるので ci（lock どおりに入れる・再現性がある）。
      - run: npm ci

      - name: テスト
        # GitHub の無料ランナーは2コアしかない。同時本数を上げるとサーバーの
        # 起動待ち（15〜20秒）に間に合わないことがあるので、ランナーの既定
        # （同時2本）をそのまま明示しておく。詰まるようなら TEST_JOBS: 1（＝直列）へ。
        env:
          TEST_JOBS: 2
        run: npm test
