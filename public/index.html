<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<!-- viewport-fit=cover: iPhone のノッチ／ホームバーの下まで描く。
     はみ出しぶんは style.css が env(safe-area-inset-*) で内側に逃がす。 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Block Blitz Arena — ブロックパズル×オンライン対戦</title>
<meta name="description" content="無料のブロックパズル×オンライン対戦ゲーム。1v1ランクマッチ・2v2チーム戦・レイドボス・100階ダンジョン・ウィークリーチャレンジ！ Free block-puzzle battle arena: ranked 1v1, co-op raids, a 100-floor dungeon & weekly challenges. Play free in your browser!">
<meta name="theme-color" content="#141a33">
<meta property="og:title" content="Block Blitz Arena">
<meta property="og:description" content="ブロックパズル×オンライン対戦アリーナ！ Ranked 1v1, team battles, raids & a 100-floor dungeon — free in your browser.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://block-blitz-arena.onrender.com/">
<meta property="og:image" content="https://block-blitz-arena.onrender.com/icons/icon-512.png">
<meta property="og:site_name" content="Block Blitz Arena">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Block Blitz Arena">
<meta name="twitter:description" content="ブロックパズル×オンライン対戦！ Free block-puzzle battle arena in your browser.">
<meta name="twitter:image" content="https://block-blitz-arena.onrender.com/icons/icon-512.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='8' y='8' width='38' height='38' rx='8' fill='%235b8bff'/><rect x='54' y='8' width='38' height='38' rx='8' fill='%23ff5d5d'/><rect x='8' y='54' width='38' height='38' rx='8' fill='%23ffe14d'/><rect x='54' y='54' width='38' height='38' rx='8' fill='%235ee86e'/></svg>">
</head>
<body>
<div id="app">

  <!-- ===================== Top bar ===================== -->
  <header id="topbar">
    <button id="userChip" class="chip">
      <span id="userAvatar">👤</span>
      <span id="userName">ゲスト</span>
      <span id="userLevel" class="lvl hidden">Lv.1</span>
    </button>
    <div class="currency">
      <span class="chip coin-chip">🪙 <b id="coinsLabel">0</b></span>
      <span class="chip gem-chip">💎 <b id="gemsLabel">0</b></span>
      <button id="btnSettings" class="chip icon-btn" title="設定">⚙️</button>
    </div>
  </header>

  <main id="main">

    <!-- ===================== Menu ===================== -->
    <section id="screen-menu" class="screen">
      <div class="menu-bg" aria-hidden="true">
        <span class="fb fb1"></span><span class="fb fb2"></span><span class="fb fb3"></span>
        <span class="fb fb4"></span><span class="fb fb5"></span><span class="fb fb6"></span>
      </div>
      <div class="menu-content">
        <h1 class="logo">
          <span class="logo-block b1">B</span><span class="logo-block b2">L</span><span class="logo-block b3">O</span><span class="logo-block b4">C</span><span class="logo-block b5">K</span>
          <br>
          <span class="logo-sub">BLITZ ARENA</span>
        </h1>
        <!-- 開催中のイベント入口は、モード一覧より上・ロゴ直下に置く。
             メニュー最下部にあった頃は、iPhone SE(375x667)では下まで
             スクロールしないと現れず、管理者イベントに入る唯一の入口が
             画面外にあった（開催中でも気づけない）。 -->
        <div id="eventBanner" class="event-banner hidden"></div>
        <button id="aeBanner" class="ae-banner hidden"></button>
        <div class="menu-buttons">
          <button class="btn btn-primary btn-big" id="btnSolo">▶ ソロプレイ</button>
          <button class="btn btn-ai btn-big" id="btnVsAi">🤖 AI対戦</button>
          <button class="btn btn-boss btn-big" id="btnBoss">🐲 ボス戦</button>
          <button class="btn btn-dungeon btn-big" id="btnDungeon">🏰 ダンジョン</button>
          <button class="btn btn-sprint btn-big" id="btnSprint">⏱️ タイムアタック</button>
          <button class="btn btn-weekly btn-big" id="btnWeekly">🎯 ウィークリー</button>
          <button class="btn btn-daily btn-big" id="btnDaily">📅 デイリー</button>
          <button class="btn btn-oni btn-big" id="btnSurvival">💀 サバイバル</button>
          <button class="btn btn-melt btn-big" id="btnMeltdown">☢️ メルトダウン</button>
          <button class="btn btn-chimera btn-big" id="btnChimera">🧬 キメラ工房</button>
          <!-- ⛓️🏗️🛠️ は第3波の新モード。他のモードボタンと同じく日本語が正。
               英語面は main.js の ensureNewModeButtons() → ensureModeButton() が
               起動時に t() の結果へ textContent を揃える（言語切替はページごと
               リロードされるので、これで日英とも常に正しい）。i18n.js の
               applyStaticI18n() に set('#btnChain', ...) を足しても同じ文言に
               なるだけで取り合いにはならない。 -->
          <button class="btn btn-chain btn-big" id="btnChain">⛓️ 連鎖カスケード</button>
          <button class="btn btn-blueprint btn-big" id="btnBlueprint">🏗️ ブループリント</button>
          <button class="btn btn-puzzle btn-big" id="btnPuzzle">🧩 パズル遺跡</button>
          <!-- #btnWorkshop は screens.js の ensureWorkshopNav() が探している id。
               ここに在ると screens.js はナビへの自動追加をやめてこのボタンを拾い、
               openWorkshop() を割り当てる（二重に生えない）。main.js は
               screens.js の評価より後に走るので、上書きしたければできる。 -->
          <button class="btn btn-workshop btn-big" id="btnWorkshop">🛠️ パズル工房</button>
          <button class="btn btn-dig btn-big" id="btnDig">⛏️ 採掘場</button>
          <button class="btn btn-ghostmode btn-big hidden" id="btnGhost">👻 幽霊屋敷</button>
          <button class="btn btn-chaos btn-big hidden" id="btnChaos">🌪️ カオスモード</button>
          <button class="btn btn-online btn-big" id="btnOnline">🌐 オンライン対戦</button>
        </div>
        <nav class="menu-nav">
          <button class="nav-btn" id="btnMissions"><span>📋</span>ミッション<i id="missionDot" class="nav-dot hidden"></i></button>
          <button class="nav-btn" id="btnFriends"><span>🤝</span>フレンド<i id="friendDot" class="nav-dot hidden"></i></button>
          <button class="nav-btn" id="btnGuild"><span>🏰</span>ギルド</button>
          <button class="nav-btn" id="btnNews"><span>📰</span>ニュース<i id="newsDot" class="nav-dot hidden"></i></button>
          <button class="nav-btn" id="btnLeaderboard"><span>🏆</span>ランキング</button>
          <button class="nav-btn" id="btnInventory"><span>🎒</span>インベントリ</button>
          <button class="nav-btn" id="btnShop"><span>🛍️</span>ショップ</button>
          <button class="nav-btn" id="btnGacha"><span>🎰</span>ガチャ</button>
          <button class="nav-btn" id="btnGemShop"><span>💎</span>課金</button>
          <button class="nav-btn" id="btnBattlePass"><span>🎫</span>バトルパス</button>
          <button class="nav-btn hidden" id="btnAdmin"><span>🛡️</span>管理</button>
        </nav>
        <button id="pollBanner" class="poll-banner hidden"></button>
        <div id="seasonBanner" class="season-banner hidden"></div>
        <div id="onlineBadge" class="online-badge hidden">🟢 オンライン: <b id="onlineCount">0</b>人<span id="moodTag" class="mood-tag"></span></div>
        <button id="liveFeed" class="live-feed hidden" title="ライブフィード"><span class="lf-dot"></span><span id="liveFeedText">📡</span></button>
      </div>
    </section>

    <!-- ===================== Game ===================== -->
    <section id="screen-game" class="screen hidden">
      <div class="game-hud">
        <div class="hud-left">
          <button id="btnQuit" class="chip icon-btn">✕</button>
          <button id="btnReroll" class="chip icon-btn" title="ピースを引き直す（1ゲーム1回）">🔄<b id="rerollLeft">1</b></button>
          <button id="btnUlt" class="chip icon-btn ult-btn hidden" title="奥義：ゲージ満タンで発動！">
            <span class="ult-ring"></span><span id="ultIcon" class="ult-icon">💥</span><b id="ultPct">0</b>
          </button>
          <button id="btnAuto" class="chip icon-btn hidden" title="オートパイロット（管理者専用）">🤖<b id="autoState">OFF</b></button>
          <button id="btnAdminCmd" class="chip icon-btn hidden" title="管理者コマンド">🛡️</button>
          <button id="btnEmote" class="chip icon-btn hidden" title="エモートを送る">😊</button>
        </div>
        <div class="hud-center">
          <div id="hudScore" class="hud-score">0</div>
          <div id="hudSub" class="hud-sub">BEST 0</div>
        </div>
        <div id="hudTimer" class="hud-timer hidden">2:00</div>
      </div>
      <div id="chaosBar" class="chaos-bar hidden" title="つぎのルール変化まで"><div id="chaosBarFill"></div></div>
      <div id="itemBar" class="item-bar hidden"></div>
      <div id="coopBar" class="coop-bar hidden">
        <div id="coopTurnLabel" class="coop-turn-label">🤝</div>
        <div class="coop-turnbar"><div id="coopTurnFill"></div></div>
      </div>
      <div id="oppPanel" class="opp-panel hidden">
        <div class="vs-bar"><div id="vsBarMe"></div><div id="vsBarOpp"></div></div>
        <div id="teamTotals" class="team-totals hidden"></div>
        <div id="oppCards"></div>
        <button id="btnOppDensity" class="opp-density hidden" title="仲間の表示を切り替える">▾</button>
      </div>
      <div id="bossPanel" class="boss-panel hidden">
        <span id="bossEmoji" class="boss-emoji">🟢</span>
        <div class="boss-info">
          <div id="bossName" class="boss-name">ボス</div>
          <div class="boss-hpbar"><div id="bossHp"></div></div>
          <div id="bossHpText" class="boss-hptext">0 / 0</div>
          <div class="boss-atkbar" title="つぎの攻撃"><div id="bossAtkBar"></div></div>
        </div>
      </div>
      <div class="game-canvas-wrap">
        <canvas id="gameCanvas"></canvas>
      </div>
    </section>

    <!-- ===================== Matchmaking ===================== -->
    <section id="screen-matchmaking" class="screen hidden">
      <div class="mm-box">
        <div class="mm-spinner"><span></span><span></span><span></span><span></span></div>
        <h2 id="mmStatus">対戦相手を探しています…</h2>
        <!-- 接続人数は独立した行に置く。#mmSub は待ち時間の表示で
             innerHTML ごと差し替わるので、中に id を置くと消える。 -->
        <p id="mmOnlineLine" class="muted">オンライン: <span id="mmOnline">-</span>人</p>
        <p id="mmSub" class="muted"></p>
        <p id="mmQueue" class="muted mm-queue"></p>
        <button class="btn btn-ghost" id="btnCancelQueue">キャンセル</button>
      </div>
    </section>

    <!-- ===================== Custom room ===================== -->
    <section id="screen-room" class="screen sub-screen hidden">
      <div class="sub-header">
        <button class="chip icon-btn" id="btnRoomBack">←</button>
        <h2>🔧 カスタムルーム</h2>
      </div>
      <div id="roomJoin" class="room-join">
        <button class="btn btn-primary btn-big" id="btnCreateRoom">➕ ルームを作成</button>
        <div class="room-join-row">
          <input id="roomCodeInput" type="text" maxlength="4" placeholder="コード" autocomplete="off">
          <button class="btn btn-online" id="btnJoinRoom">参加する</button>
        </div>
        <p class="muted center" style="font-size:13px">友達と同じコードで集まって対戦！<br>チーム戦は先に入った2人がチームAになります</p>
      </div>
      <div id="roomLobby" class="room-lobby hidden">
        <div class="room-code">ルームコード <b id="roomCodeLabel">----</b></div>
        <div id="roomPlayers" class="room-players"></div>
        <div id="roomSettings" class="room-settings"></div>
        <div class="modal-buttons" style="max-width:420px">
          <button class="btn btn-ghost" id="btnLeaveRoom">退出</button>
          <button class="btn btn-gold" id="btnStartRoom">🚀 対戦開始！</button>
        </div>
      </div>
    </section>

    <!-- ===================== Leaderboard ===================== -->
    <section id="screen-leaderboard" class="screen sub-screen hidden">
      <div class="sub-header">
        <button class="chip icon-btn back-btn" data-back>←</button>
        <h2>🏆 ランキング</h2>
      </div>
      <div class="tabs">
        <button class="tab active" data-lb="score">ハイスコア</button>
        <button class="tab" data-lb="rating">レート</button>
        <button class="tab" data-lb="sprint">⏱️タイムアタック</button>
        <button class="tab" data-lb="dungeon">ダンジョン</button>
        <button class="tab" data-lb="weekly">ウィークリー</button>
        <button class="tab" data-lb="daily">📅デイリー</button>
        <button class="tab" data-lb="puzzle">🧩パズル遺跡</button>
        <button class="tab" data-lb="dig">⛏️採掘場</button>
      </div>
      <div id="lbList" class="lb-list"><p class="muted center">読み込み中…</p></div>
    </section>

    <!-- ===================== Shop ===================== -->
    <section id="screen-inventory" class="screen sub-screen hidden">
      <div class="sub-header">
        <button class="chip icon-btn back-btn" data-back>←</button>
        <h2>🎒 インベントリ</h2>
      </div>
      <div id="invSummary" class="inv-summary"></div>
      <div class="tabs">
        <button class="tab active" data-inv="gear">装備</button>
        <button class="tab" data-inv="item">アイテム</button>
        <button class="tab" data-inv="title">称号</button>
        <button class="tab" data-inv="badge">バッジ</button>
      </div>
      <div id="invBody" class="inv-body"></div>
    </section>

    <section id="screen-shop" class="screen sub-screen hidden">
      <div class="sub-header">
        <button class="chip icon-btn back-btn" data-back>←</button>
        <h2>🛍️ ショップ</h2>
      </div>
      <div class="tabs">
        <button class="tab active" data-shop="skin">ブロック</button>
        <button class="tab" data-shop="board">ボード</button>
        <button class="tab" data-shop="fx">エフェクト</button>
        <button class="tab" data-shop="ult">⚡奥義</button>
        <button class="tab" data-shop="item">アイテム</button>
      </div>
      <div id="shopGrid" class="shop-grid"></div>
    </section>

    <!-- ===================== Missions / achievements ===================== -->
    <section id="screen-missions" class="screen sub-screen hidden">
      <div class="sub-header">
        <button class="chip icon-btn back-btn" data-back>←</button>
        <h2>📋 ミッション</h2>
      </div>
      <div class="tabs">
        <button class="tab active" data-ms="daily">デイリー</button>
        <button class="tab" data-ms="weekly">ウィークリー</button>
        <button class="tab" data-ms="ach">🏅 実績</button>
      </div>
      <div id="msBody" class="ms-body"></div>
    </section>

    <!-- ===================== Battle pass ===================== -->
    <section id="screen-battlepass" class="screen sub-screen hidden">
      <div class="sub-header">
        <button class="chip icon-btn back-btn" data-back>←</button>
        <h2>🎫 バトルパス</h2>
      </div>
      <div id="bpHeader" class="bp-header"></div>
      <div id="bpTiers" class="bp-tiers"></div>
    </section>

    <!-- ===================== Guild ===================== -->
    <!-- ===================== Friends ===================== -->
    <section id="screen-friends" class="screen sub-screen hidden">
      <div class="sub-header">
        <button class="chip icon-btn back-btn" data-back>←</button>
        <h2>🤝 フレンド</h2>
      </div>
      <div class="tabs">
        <button class="tab active" data-fr="list">フレンド</button>
        <button class="tab" data-fr="requests">申請<i id="frReqDot" class="nav-dot hidden"></i></button>
        <button class="tab" data-fr="find">さがす</button>
        <button class="tab" data-fr="settings">設定</button>
      </div>
      <div id="friendsBody" class="inv-body"></div>
    </section>

    <section id="screen-guild" class="screen sub-screen hidden">
      <div class="sub-header">
        <button class="chip icon-btn back-btn" data-back>←</button>
        <h2>🏰 ギルド</h2>
      </div>
      <div class="tabs">
        <button class="tab active" data-gd="mine">マイギルド</button>
        <button class="tab" data-gd="rank">ランキング</button>
        <button class="tab" data-gd="find">さがす</button>
      </div>
      <div id="guildBody" class="ms-body"></div>
    </section>

    <!-- ===================== News ===================== -->
    <section id="screen-news" class="screen sub-screen hidden">
      <div class="sub-header">
        <button class="chip icon-btn back-btn" data-back>←</button>
        <h2>📰 ニュース</h2>
        <button class="btn btn-sm btn-primary hidden" id="btnNewsPost" style="margin-left:auto">✍️ 投稿</button>
      </div>
      <div id="newsBody" class="ms-body"></div>
    </section>

    <!-- ===================== Admin ===================== -->
    <section id="screen-admin" class="screen sub-screen hidden">
      <div class="sub-header">
        <button class="chip icon-btn back-btn" data-back>←</button>
        <h2>🛡️ 管理者パネル</h2>
      </div>
      <div id="adminStats" class="admin-stats"></div>
      <div class="admin-actions">
        <div class="admin-broadcast">
          <input id="adminMsg" type="text" placeholder="全員へのお知らせを入力…" maxlength="200">
          <button class="btn btn-primary" id="btnBroadcast">送信</button>
        </div>
      </div>
      <div class="admin-actions">
        <button class="btn btn-ghost btn-sm" id="btnSeasonManage">🗓️ シーズン管理</button>
        <button class="btn btn-ghost btn-sm" id="btnMaintenance">🛠 メンテナンス</button>
        <button class="btn btn-ghost btn-sm" id="btnBackup">💾 バックアップDL</button>
        <button class="btn btn-ghost btn-sm" id="btnRestore" style="color:var(--green)">♻️ データ復元</button>
        <button class="btn btn-ghost btn-sm" id="btnBugReports">🐛 バグ報告</button>
        <button class="btn btn-ghost btn-sm" id="btnLbReset" style="color:var(--red)">🏆 ランキングリセット</button>
      </div>
      <div class="admin-actions">
        <button class="btn btn-ghost btn-sm" id="btnSelfCoins">💰 自分にコイン付与</button>
        <button class="btn btn-ghost btn-sm" id="btnSelfGems">💎 自分にジェム付与</button>
        <button class="btn btn-ghost btn-sm" id="btnSelfItems">🧪 自分にアイテム付与</button>
        <button class="btn btn-ghost btn-sm" id="btnUnlockHidden">🔓 隠し難易度を全解放</button>
        <button class="btn btn-ghost btn-sm" id="btnEvent">🎪 期間限定イベント</button>
        <button class="btn btn-ghost btn-sm" id="btnAdminEvent">👑 管理者イベント（週1・予約制）</button>
        <button class="btn btn-ghost btn-sm" id="btnPoll">🗳️ 投票を作る</button>
        <button class="btn btn-ghost btn-sm" id="btnWeeklyReset" style="color:var(--red)">🎯 ウィークリー記録リセット</button>
      </div>
      <div class="admin-actions">
        <button class="btn btn-ghost btn-sm" id="btnMissionsDone">📋 自分のミッション全達成</button>
        <button class="btn btn-ghost btn-sm" id="btnAchReset" style="color:var(--red)">🏅 自分の実績受取をリセット</button>
      </div>
      <div class="admin-actions">
        <button class="btn btn-ghost btn-sm" id="btnPop">🎭 にぎわい設定</button>
        <button class="btn btn-ghost btn-sm" id="btnChatSay">💬 AIに発言させる</button>
        <button class="btn btn-ghost btn-sm" id="btnGrantAll">🎁 全員に配布</button>
        <button class="btn btn-ghost btn-sm" id="btnPrepareUpdate">🔧 更新の準備（対戦を引き分けで終了）</button>
        <button class="btn btn-ghost btn-sm" id="btnAdminLog">🧾 操作ログ</button>
        <button class="btn btn-ghost btn-sm" id="btnChatClear" style="color:var(--red)">🧹 チャット全消去</button>
      </div>
      <div class="admin-actions">
        <input id="adminUserSearch" type="text" placeholder="🔍 ユーザー検索…" maxlength="16" style="flex:1;min-width:160px">
      </div>
      <div id="adminUsers" class="admin-users"></div>
    </section>

  </main>
</div>

<!-- ===================== Modals / toasts ===================== -->
<!-- 👥 パーティー。試合中も出したいので .chat-drawer の外に置く。 -->
<div id="partyDock" class="hidden"></div>
<div id="modal-root"></div>
<div id="toast-root"></div>

<!-- Global chat drawer (menu screen only) -->
<div id="chatDrawer" class="chat-drawer">
  <div id="chatBox" class="chat-box hidden">
    <div class="chat-head">💬 全体チャット <span id="chatOnline" class="muted"></span></div>
    <div id="chatMsgs" class="chat-msgs"></div>
    <div id="chatReplyBar" class="chat-reply-bar hidden"><span id="chatReplyText"></span><button id="chatReplyCancel" title="返信をやめる">✕</button></div>
    <div class="chat-input-row">
      <input id="chatInput" type="text" maxlength="200" placeholder="みんなにメッセージ…" autocomplete="off">
      <button class="btn btn-sm btn-primary" id="chatSend">送信</button>
    </div>
  </div>
  <button id="chatToggle" class="chat-toggle">💬<span id="chatUnread" class="chat-unread hidden">0</span></button>
</div>

<!-- Tap-to-start splash: guarantees music from the very first moment -->
